<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Boleta Electrónica</title>

<style>
body, table, td, a {
	-webkit-text-size-adjust: 100%;
	-ms-text-size-adjust: 100%;
}

table, td {
	mso-table-lspace: 0pt;
	mso-table-rspace: 0pt;
}

img {
	-ms-interpolation-mode: bicubic;
	border: 0;
	height: auto;
	line-height: 100%;
	outline: none;
	text-decoration: none;
}

a[x-apple-data-detectors] {
	color: inherit !important;
	text-decoration: none !important;
}

@media screen and (max-width: 600px) {
	.full-width-table {
		width: 100% !important;
	}
	.content-padding {
		padding: 10px !important;
	}
	.header-text {
		font-size: 24px !important;
	}
}
</style>
</head>

<body
	style="margin: 0; padding: 0; background: #121212; font-family: Arial, sans-serif; color: #e0e0e0;">

	<table width="100%" cellpadding="0" cellspacing="0">
		<tr>
			<td align="center" style="padding: 20px 0 30px 0;">

				<table width="600" cellpadding="0" cellspacing="0"
					class="full-width-table"
					style="background: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);">

					<!-- Header -->
					<tr>
						<td align="center" bgcolor="#212121" class="header-text"
							style="padding: 40px 20px; color: #fff; font-size: 28px; font-weight: bold;">
							¡Tu Boleta para {{EVENT_NAME}}!</td>
					</tr>

					<!-- Content -->
					<tr>
						<td class="content-padding" style="padding: 30px 40px;">

							<p style="font-size: 16px;">
								Hola {{USER_NAME}},<br> Aquí tienes tu boleta digital.
								Preséntala al ingresar.
							</p>

							<table width="100%" cellpadding="10" cellspacing="0"
								style="border: 1px solid #333; margin-bottom: 25px;">

								<tr>
									<td style="color: #bbb;">Número de Boleta</td>
									<td style="color: #fff;">{{TICKET_CODE}}</td>
								</tr>

								<tr>
									<td style="color: #bbb;">Fecha y Hora</td>
									<td style="color: #fff;">{{EVENT_DATE}} - {{EVENT_HOUR}}</td>
								</tr>

								<tr>
									<td style="color: #bbb;">Etapa</td>
									<td style="color: #fff;">{{STAGE_NAME}}</td>
								</tr>

							</table>

							<div align="center">
								<p style="color: #4a90e2; font-weight: bold;">Muestra este
									código al entrar</p>

								<img src="cid:qrcode" width="200" height="200"
									style="border: 1px solid #333; border-radius: 6px;">

								<p style="font-size: 14px; color: #888;">Código: {{QR_UUID}}
								</p>
							</div>

						</td>
					</tr>

					<!-- Footer -->
					<tr>
						<td align="center"
							style="padding: 20px; background: #1a1a1a; font-size: 12px; color: #777;">
							© 2026 Digital Veltrix</td>
					</tr>

				</table>

			</td>
		</tr>
	</table>

</body>
</html>

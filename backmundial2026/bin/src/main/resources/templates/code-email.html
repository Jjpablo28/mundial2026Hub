<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Código de Verificación</title>

<style>
body, table, td, a {
	-webkit-text-size-adjust: 100%;
	-ms-text-size-adjust: 100%;
}

table {
	border-collapse: collapse;
}

@media screen and (max-width: 600px) {
	.container {
		width: 100% !important;
	}
	.content {
		padding: 20px !important;
	}
}
</style>
<style>
.digit {
	background:#ffffff;
	border:1px solid #ccc;
	border-radius:10px;
	width:50px;
	height:60px;
	text-align:center;
	font-size:26px;
	font-weight:bold;
	color:#000;
}
</style>

</head>

<body
	style="margin: 0; padding: 0; background: #121212; font-family: Arial, sans-serif; color: #e0e0e0;">

	<table width="100%" cellpadding="0" cellspacing="0">
		<tr>
			<td align="center" style="padding: 30px 0;">

				<table width="600" class="container"
					style="background: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);">

					<tr>
						<td align="center"
							style="padding: 35px 20px; background: #212121; font-size: 26px; font-weight: bold; color: #ffffff;">
							Bienvenido a <span style="color: #4a90e2;">Mundial 2026 Hub</span>
						</td>
					</tr>

					<tr>
						<td class="content" style="padding: 30px 40px;">

							<p style="font-size: 16px; line-height: 24px;">
								Gracias por registrarte. Para continuar, utiliza el siguiente <strong>código
									de verificación</strong>:
							</p>

							<table align="center" cellpadding="0" cellspacing="0">
								<tr>
									<td class="digit">{{D1}}</td>
									<td width="18"></td>
									<td class="digit">{{D2}}</td>
									<td width="18"></td>
									<td class="digit">{{D3}}</td>
									<td width="18"></td>
									<td class="digit">{{D4}}</td>
									<td width="18"></td>
									<td class="digit">{{D5}}</td>
									<td width="18"></td>
									<td class="digit">{{D6}}</td>
								</tr>
							</table>

							<p style="font-size: 14px; color: #bbb; margin-top: 25px;">
								Este código es único, solo puede usarse una vez y tiene una
								duración de <strong>10 minutos</strong>.
							</p>

						</td>
					</tr>

					<tr>
						<td align="center"
							style="padding: 20px; background: #1a1a1a; font-size: 12px; color: #777;">
							© 2026 Mundial 2026 Hub</td>
					</tr>

				</table>

			</td>
		</tr>
	</table>

</body>
</html>

<div class="auth-container">
  <div class="auth-wrapper">

    <!-- Columna izquierda: Registro -->
    <div class="auth-left">
      <div class="auth-card">
        <h2>Crear cuenta</h2>
        <p class="subtitle">Regístrate para continuar</p>

        <form (ngSubmit)="register()" #registerForm="ngForm">

          <div class="input-group">
            <input type="text" [(ngModel)]="userName" name="user" placeholder="Usuario" required/>
          </div>

          <div class="input-group">
            <input type="text" [(ngModel)]="name" name="name" placeholder="Nombre Completo" required/>
          </div>

          <div class="input-group">
            <input type="email" [(ngModel)]="email" name="email"
                   (input)="formatIdentifier()" placeholder="Correo electrónico" required/>
          </div>

          <div class="input-group">
            <input type="text" [(ngModel)]="id" name="id" placeholder="Identificación" required/>
          </div>

          <div class="input-group">
            <select [(ngModel)]="country" name="country" (ngModelChange)="onCountryChange($event)" required>
              <option value="" disabled>Selecciona un país</option>
              <option *ngFor="let c of countries" [value]="c">{{ c }}</option>
            </select>
          </div>

          <div class="input-group">
            <select [(ngModel)]="city" name="city" [disabled]="cities.length === 0" required>
              <option value="" disabled>Selecciona una ciudad</option>
              <option *ngFor="let c of cities" [value]="c">{{ c }}</option>
            </select>
          </div>

          <div class="input-group">
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Contraseña"
              required
              #passwordField="ngModel"
              [class.input-error]="passwordField.touched && !isPasswordValid(password)"
              (focus)="passwordFocused = true"
              (blur)="passwordFocused = false"
            />
            <div class="password-hints" *ngIf="passwordField.touched || passwordFocused">
  <span [class.ok]="password.length >= 8">
  <i class="fas" [class.fa-check]="password.length >= 8" [class.fa-times]="password.length < 8"></i>
  Mínimo 8 caracteres
</span>
              <span [class.ok]="hasLower(password)">
    <i class="fas" [class.fa-check]="hasLower(password)" [class.fa-times]="!hasLower(password)"></i>
    Una minúscula
  </span>
              <span [class.ok]="hasUpper(password)">
    <i class="fas" [class.fa-check]="hasUpper(password)" [class.fa-times]="!hasUpper(password)"></i>
    Una mayúscula
  </span>
              <span [class.ok]="hasDigit(password)">
    <i class="fas" [class.fa-check]="hasDigit(password)" [class.fa-times]="!hasDigit(password)"></i>
    Un número
  </span>
              <span [class.ok]="hasSymbol(password)">
    <i class="fas" [class.fa-check]="hasSymbol(password)" [class.fa-times]="!hasSymbol(password)"></i>
    Un símbolo especial
  </span>
              <span [class.ok]="hasNoForbidden(password)">
    <i class="fas" [class.fa-check]="hasNoForbidden(password)" [class.fa-times]="!hasNoForbidden(password)"></i>
    Sin caracteres prohibidos ni solo números
  </span>
            </div>
          </div>


          <button type="submit" [disabled]="isLoading || !registerForm.valid || !isPasswordValid(password)">
            <!-- Si NO está cargando, muestra el texto normal -->
            <span *ngIf="!isLoading">Registrarse</span>

            <!-- Si ESTÁ cargando, muestra el loader -->
            <span *ngIf="isLoading" class="loader-container">
    <i class="fas fa-spinner fa-spin"></i> Cargando...
  </span>
          </button>

        </form>

        <p class="link-text">
          ¿Ya tienes cuenta? <a routerLink="/">Inicia sesión</a>
        </p>
      </div>
    </div>

    <!-- Columna derecha: Información / Imagen -->
    <div class="auth-right">
      <div class="info-box">

        <img src="assets/img/ae69d8e0-e865-468d-93ec-b9263784c326.jpg" alt="Registro Info"/>
      </div>
    </div>

  </div>
  <div class="custom-popup" *ngIf="showErrorPopup">
    <div class="popup-content border-error">
      <i class="fas fa-exclamation-circle error-icon"></i>
      <span>{{ errorMessage }}</span>
      <button class="close-btn" (click)="showErrorPopup = false">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>
</div>

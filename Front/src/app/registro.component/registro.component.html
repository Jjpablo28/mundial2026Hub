<div class="auth-container">
  <div class="auth-wrapper">

    <!-- Columna izquierda: Registro -->
    <div class="auth-left">
      <div class="auth-card">
        <h2>Crear cuenta</h2>
        <p class="subtitle">Regístrate para continuar</p>

        <form (ngSubmit)="register()" #registerForm="ngForm">

          <div class="input-group">
            <input
              type="text"
              name="user"
              [(ngModel)]="form.user"
              required
              placeholder="Usuario"
            />
          </div>

          <div class="input-group">
            <input
              type="email"
              name="email"
              [(ngModel)]="form.email"
              required
              placeholder="Correo electrónico"
            />
          </div>

          <div class="input-group">
            <select
              name="country"
              [(ngModel)]="form.country"
              (change)="onCountryChange()"
              required
            >
              <option value="" disabled selected>Selecciona un país</option>
              <option *ngFor="let c of countries" [value]="c.country">
                {{ c.country }}
              </option>
            </select>
          </div>

          <div class="input-group">
            <select
              name="city"
              [(ngModel)]="form.city"
              required
            >
              <option value="" disabled selected>Selecciona una ciudad</option>
              <option *ngFor="let c of cities" [value]="c">
                {{ c }}
              </option>
            </select>
          </div>

          <div class="input-group">
            <select
              name="team"
              [(ngModel)]="form.team"
            >
              <option value="" disabled selected>Equipo favorito (próximamente)</option>
              <option *ngFor="let t of teams" [value]="t">
                {{ t }}
              </option>
            </select>
          </div>

          <button type="submit" class="btn-primary">
            Registrarse
          </button>

        </form>

        <p class="link-text">
          ¿Ya tienes cuenta? <a routerLink="/">Inicia sesión</a>
        </p>
      </div>
    </div>

    <!-- Columna derecha: Información / Imagen -->
    <div class="auth-right">
      <div class="info-box">
        <h3>Únete a nuestra comunidad</h3>
        <p>Comparte tu pasión y descubre todo lo relacionado con tu equipo favorito.</p>
        <img src="assets/register-image.png" alt="Registro Info" />
      </div>
    </div>

  </div>
</div>

<div class="update-loader-overlay" *ngIf="isUpdating">
  <div class="spinner"></div>
  <p>Guardando cambios...</p>
</div>

<div class="profile-summary">
  <div class="avatar-circle active"><img [src]="imageUrl" alt="Avatar Actual"></div>
  <div class="profile-details">
    <h2>{{ userName }}</h2>
    <span class="status-badge"><i class="fas fa-check-circle"></i> Verificado</span>
  </div>
</div>

<div class="settings-container">
  <div class="card">
    <h3 class="card-title"><i class="fas fa-user-circle"></i> Avatar de Perfil</h3>
    <p class="text-muted" style="margin-bottom: 15px; font-size: 0.9rem;">Elige cómo te verán los demás:</p>
    <div class="avatar-selector">
      <div
        class="avatar-option"
        *ngFor="let url of avatarUrls"
        [class.active]="imageUrl === url"
        (click)="selectAvatar(url)">
        <img [src]="url" alt="Opción de Avatar">
      </div>
    </div>
  </div>

  <div class="card">
    <h3 class="card-title"><i class="fas fa-address-card"></i> Información Personal</h3>
    <div class="form-grid">
      <label>Nombre Completo</label>
      <div class="input-box">
        <i class="fas fa-id-card"></i>
        <input type="text" [(ngModel)]="name" placeholder="Tu nombre">
      </div>

      <label>Nombre de Usuario</label>
      <div class="input-box">
        <i class="fas fa-at"></i>
        <input type="text" [(ngModel)]="userName" placeholder="Username">
      </div>

      <label>Correo Electrónico</label>
      <div class="input-box">
        <i class="fas fa-envelope"></i>
        <input type="email" [(ngModel)]="email" disabled>
      </div>

      <label>País</label>
      <div class="input-box">
        <i class="fas fa-globe-americas"></i>
        <select [(ngModel)]="country" (ngModelChange)="onCountryChange($event)">
          <option *ngFor="let c of countries" [value]="c">{{ c }}</option>
        </select>
      </div>

      <label>Ciudad</label>
      <div class="input-box">
        <i class="fas fa-city"></i>
        <select [(ngModel)]="city" [disabled]="cities.length === 0">
          <option *ngFor="let c of cities" [value]="c">{{ c }}</option>
        </select>
      </div>

      <label>Equipo Favorito</label>
      <div class="input-box custom-dropdown-container">
        <i class="fas fa-futbol main-icon"></i>
        <div class="custom-select" (click)="toggleDropdown()">
          <ng-container *ngIf="selectedTeam; else placeholderTpl">
            <img [src]="selectedTeam.crest" class="flag-icon" alt="crest">
            <span>{{ selectedTeam.name }}</span>
          </ng-container>
          <ng-template #placeholderTpl>Selecciona un equipo...</ng-template>
          <i class="fas fa-chevron-down arrow-icon"></i>
        </div>
        <div class="custom-options" *ngIf="isDropdownOpen">
          <div class="option-item" *ngFor="let t of teams" (click)="selectTeam(t)">
            <img [src]="t.crest" class="flag-icon" alt="crest">
            <span>{{ t.name }}</span>
          </div>
        </div>
      </div>

      <div class="form-action">
        <button class="btn-primary" (click)="updateUser()">
          <i class="fas fa-save"></i> Guardar Cambios
        </button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3 class="card-title"><i class="fas fa-lock"></i> Seguridad</h3>
    <div class="form-grid">
      <label>Contraseña Actual</label>
      <div class="input-box">
        <i class="fas fa-key"></i>
        <input [type]="showOldPass ? 'text' : 'password'" [(ngModel)]="oldPassword">
        <i class="fas toggle-password" [ngClass]="showOldPass ? 'fa-eye-slash' : 'fa-eye'" (click)="showOldPass = !showOldPass"></i>
      </div>

      <label>Nueva Contraseña</label>
      <div class="input-box">
        <i class="fas fa-shield-alt"></i>
        <input [type]="showNewPass ? 'text' : 'password'" [(ngModel)]="newPassword">
        <i class="fas toggle-password" [ngClass]="showNewPass ? 'fa-eye-slash' : 'fa-eye'" (click)="showNewPass = !showNewPass"></i>
      </div>

      <div class="form-action">
        <button class="btn-primary" (click)="updatePassword()"><i class="fas fa-sync-alt"></i> Actualizar</button>
      </div>
    </div>
  </div>

  <div class="card danger-zone">
    <h3 class="card-title"><i class="fas fa-exclamation-triangle"></i> Zona de Peligro</h3>
    <p class="danger-text">Borrar tu cuenta eliminará permanentemente todos tus datos.</p>
    <div class="form-action">
      <button class="btn-danger" (click)="deleteAccount()"><i class="fas fa-trash-alt"></i> Eliminar Cuenta</button>
    </div>
  </div>
</div>

<div class="custom-toast" [ngClass]="toast.type" [class.show]="toast.show">
  <div class="toast-icon">
    <i class="fas" [ngClass]="{
      'fa-check-circle': toast.type === 'success',
      'fa-times-circle': toast.type === 'error',
      'fa-info-circle': toast.type === 'info'
    }"></i>
  </div>
  <div class="toast-content">
    <p>{{ toast.message }}</p>
  </div>
  <button class="toast-close" (click)="closeToast()">
    <i class="fas fa-times"></i>
  </button>
  <div class="toast-progress"></div>
</div>

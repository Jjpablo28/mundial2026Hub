<header class="header">
  <div class="header-container">
    <div class="logo" routerLink="/dashboard" style="cursor: pointer;">
      <img src="assets/img/favicon.ico" alt="Logo">
      <span>Mundial 2026</span>
    </div>

    <nav>
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" routerLinkActive="active">Iniciar Sesión</a>
        <a routerLink="/register" routerLinkActive="active">Registro</a>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <a routerLink="/home" routerLinkActive="active">Menú</a>
        <a routerLink="/payment" routerLinkActive="active">Comprar</a>

        <ng-container *ngIf="userRole === 'ADMIN' || userRole === 'admin'">
          <a routerLink="/admin/usuarios" routerLinkActive="active">Usuarios</a>
          <a routerLink="/admin/configuracion" routerLinkActive="active">Sistema</a>
        </ng-container>

        <div class="user-menu" style="display: flex; align-items: center; gap: 15px; margin-left: 15px; height: 100%;">
          <span class="tokens-badge">
            🪙 {{ userPoints }} Pts
          </span>

          <span style="color: #E1FF57; font-weight: 600;">
            {{ userName || 'Usuario' }}
          </span>
          <button (click)="logout()" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.3s;">
            Cerrar Sesión
          </button>
        </div>

      </ng-container>
    </nav>
  </div>
</header>

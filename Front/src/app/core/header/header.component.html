<header class="header">
  <div class="header-container">

    <div class="logo" [routerLink]="'/' + urlRedi">
      <img src="assets/img/favicon.ico" alt="Logo">
      <span>Mundial 2026</span>
    </div>

    <!-- Botón hamburguesa -->
    <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Nav desktop -->
    <nav [class.nav-open]="menuOpen">

      <!-- Overlay para cerrar en móvil -->
      <div class="nav-overlay" *ngIf="menuOpen" (click)="toggleMenu()"></div>

      <div class="nav-links">
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Iniciar Sesión</a>
          <a routerLink="/register" routerLinkActive="active" (click)="closeMenu()">Registro</a>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <a routerLink="/home" routerLinkActive="active" (click)="closeMenu()">Menú</a>
          <a routerLink="/payment" routerLinkActive="active" (click)="closeMenu()">Comprar</a>

          <ng-container *ngIf="userRole === 'ADMIN' || userRole === 'admin'">
            <a routerLink="/admin/usuarios" routerLinkActive="active" (click)="closeMenu()">Usuarios</a>
            <a routerLink="/admin/soporte" routerLinkActive="active" (click)="closeMenu()">Sistema</a>
          </ng-container>

          <div class="user-menu">
            <span class="tokens-badge">🪙 {{ userPoints }} Pts</span>
            <span class="user-name">{{ userName || 'Usuario' }}</span>
            <button (click)="logout()" class="btn-logout">Cerrar Sesión</button>
          </div>
        </ng-container>
      </div>

    </nav>

  </div>
</header>

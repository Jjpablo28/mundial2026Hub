<div class="dashboard-container">
  <aside class="sidebar">
    <div class="logo">
      <h2>SISTEMA<span>.</span></h2>
    </div>
    <nav class="menu">
      <a class="menu-item active"><i class="icon"></i> Dashboard</a>
      <a class="menu-item"><i class="icon"></i> Reportes</a>
      <a class="menu-item"><i class="icon"></i> Usuarios</a>
      <a class="menu-item"><i class="icon"></i> Configuración</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div class="welcome-text">
        <h1>Bienvenido de nuevo</h1>
        <p>Rol actual: <span class="badge">TEMPORAL</span></p>
      </div>
      <div class="user-profile">
        <div class="avatar">U</div>
      </div>
    </header>

    <section class="stats-grid">
      <div class="stat-card">
        <h3>Proyectos</h3>
        <p class="number">12</p>
        <span class="trend">+2 esta semana</span>
      </div>
      <div class="stat-card">
        <h3>Actividad</h3>
        <p class="number">85%</p>
        <span class="trend">Estado óptimo</span>
      </div>
      <div class="stat-card highlighted">
        <h3>Alertas</h3>
        <p class="number">3</p>
        <span class="trend">Pendientes</span>
      </div>
    </section>

    <section class="content-body">
      <div class="data-table-container">
        <h3>Resumen de actividad reciente</h3>
        <div class="placeholder-content">
          <p>home.component works! El acceso ha sido verificado correctamente.</p>
        </div>
      </div>
    </section>
  </main>
</div>

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.mercadopago.com https://*.mercadopago.com https://*.mercadolibre.com; frame-src 'self' https://*.mercadopago.com https://*.mercadolibre.com https://secure-fields.mercadopago.com; connect-src 'self' https://*.mercadopago.com https://*.mercadolibre.com https://mundial2026hub.onrender.com; img-src 'self' data: https://*.mercadopago.com https://*.mercadolibre.com; style-src 'self' 'unsafe-inline' https://*.mercadopago.com; font-src 'self' data: https://*.mercadopago.com;"
